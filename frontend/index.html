<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试模拟 Agent - Web版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-canvas: #101010;
            --color-canvas-soft: #1a1a1a;
            --color-canvas-text-soft: #f5f6f7;
            --color-hairline: #3d3a39;
            --color-hairline-soft: #b8b3b0;
            --color-primary: #00d992;
            --color-primary-soft: #2fd6a1;
            --color-primary-deep: #10b981;
            --color-ink: #f2f2f2;
            --color-ink-strong: #ffffff;
            --color-body: #bdbdbd;
            --color-mute: #8b949e;
            --color-on-primary: #101010;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-pill: 9999px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --spacing-xl: 24px;
            --spacing-2xl: 32px;
        }

        * { box-sizing: border-box; }
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--color-canvas);
            color: var(--color-ink);
            margin: 0;
            padding: var(--spacing-lg);
            line-height: 1.65;
        }

        .container { max-width: 960px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color-canvas-soft);
            border: 1px solid var(--color-hairline);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
        }
        .header-left h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.4px;
            color: var(--color-ink-strong);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-left h1 i {
            color: var(--color-primary);
        }
        .header-left .subtitle {
            margin: 2px 0 0 0;
            font-size: 11px;
            color: var(--color-mute);
        }

        .header-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--color-body);
            padding: 4px 8px;
            background: var(--color-canvas-soft);
            border: 1px solid var(--color-hairline);
            border-radius: var(--radius-sm);
        }
        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--color-primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .intro-card {
            background: var(--color-canvas-soft);
            border: 1px solid var(--color-hairline);
            border-radius: var(--radius-md);
            padding: var(--spacing-sm) var(--spacing-md);
            margin-bottom: var(--spacing-sm);
            font-size: 12px;
            color: var(--color-body);
            display: flex;
            align-items: center;
        }

        .help-button {
            background: transparent;
            color: var(--color-mute);
            border: none;
            padding: var(--spacing-xs) var(--spacing-md);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: Inter, sans-serif;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .help-button:hover {
            color: var(--color-primary);
            background: var(--color-canvas-soft);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease-out;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--color-canvas);
            border: 1px solid var(--color-hairline);
            border-radius: var(--radius-md);
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: var(--spacing-lg) var(--spacing-2xl);
            border-bottom: 1px solid var(--color-hairline);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--color-ink-strong);
            letter-spacing: -0.6px;
        }
        .modal-close {
            background: transparent;
            border: none;
            color: var(--color-mute);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }
        .modal-close:hover {
            background: var(--color-canvas-soft);
            color: var(--color-ink);
        }

        .modal-body {
            padding: var(--spacing-2xl);
            overflow-y: auto;
        }
        .modal-body::-webkit-scrollbar { width: 6px; }
        .modal-body::-webkit-scrollbar-track { background: var(--color-canvas-soft); border-radius: 3px; }
        .modal-body::-webkit-scrollbar-thumb { background: var(--color-hairline); border-radius: 3px; }
        .modal-body::-webkit-scrollbar-thumb:hover { background: var(--color-primary-deep); }

        .command-item {
            background: var(--color-canvas-soft);
            border: 1px solid var(--color-hairline);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }
        .command-item:last-child { margin-bottom: 0; }
        .command-item code {
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            font-size: 14px;
            font-weight: 550;
            background: var(--color-canvas);
            color: var(--color-primary);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-hairline);
            display: inline-block;
            margin-bottom: var(--spacing-sm);
        }
        .command-item p {
            margin: 0;
            font-size: 14px;
            color: var(--color-body);
            line-height: 1.5;
        }

        .chat-container {
            background: var(--color-canvas);
            border: 1px solid var(--color-hairline);
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            min-height: 480px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-lg);
            background: var(--color-canvas-soft);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .message {
            margin-bottom: var(--spacing-md);
            animation: slideIn 0.3s ease-out;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { align-items: flex-end; }
        .message.agent { align-items: flex-start; }

        .message-header {
            font-size: 11px;
            color: var(--color-mute);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .message.user .message-header { justify-content: flex-end; }
        .message.agent .message-header { justify-content: flex-start; }

        .message-content {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            max-width: 70%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
        }

        .message.user .message-content {
            background: var(--color-primary);
            color: var(--color-on-primary);
            border-bottom-right-radius: var(--radius-sm);
        }

        .message.agent .message-content {
            background: var(--color-canvas-soft);
            border: 1px solid var(--color-hairline);
            border-bottom-left-radius: var(--radius-sm);
        }

        .chat-input {
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--color-canvas-soft);
            border-top: 1px solid var(--color-hairline);
            display: flex;
            gap: var(--spacing-sm);
        }
        .chat-input textarea {
            flex: 1;
            padding: var(--spacing-md) var(--spacing-lg);
            border: 1px solid var(--color-hairline);
            border-radius: var(--radius-sm);
            resize: none;
            height: 44px;
            font-size: 14px;
            font-family: Inter, sans-serif;
            background: var(--color-canvas);
            color: var(--color-ink);
            outline: none;
        }
        .chat-input textarea:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 2px rgba(0, 217, 146, 0.2);
        }
        .chat-input button {
            background: var(--color-primary);
            color: var(--color-on-primary);
            border: none;
            padding: 0 var(--spacing-lg);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: Inter, sans-serif;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-input button:hover {
            background: var(--color-primary-soft);
        }
        .chat-input button:active { transform: translateY(0); }

        .status-bar {
            padding: var(--spacing-xs) var(--spacing-lg);
            background: var(--color-canvas-soft);
            font-size: 12px;
            color: var(--color-mute);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            border-top: 1px solid var(--color-hairline);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--color-primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .typing {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--color-canvas-soft);
            border: 1px solid var(--color-hairline);
            border-radius: var(--radius-md);
            border-bottom-left-radius: var(--radius-sm);
            max-width: 70%;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--color-mute);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: var(--color-canvas-soft); border-radius: 3px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--color-hairline); border-radius: 3px; }
        .chat-messages::-webkit-scrollbar-thumb:hover { background: var(--color-primary-deep); }
    </style>
</head>
<body>
    <input type="hidden" id="sessionIdInput" value="{SESSION_ID}">

    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1><i class="fas fa-comment-dots" style="margin-right: 8px; color: var(--color-primary);"></i>面试模拟 Agent</h1>
                <div class="subtitle">Web版 · 智能面试助手</div>
            </div>
            <div class="header-right">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>在线</span>
                </div>
                <button class="help-button" id="helpBtn">
                    <i class="fas fa-question-circle"></i>
                    <span>帮助文档</span>
                </button>
            </div>
        </div>

        <div class="intro-card">
            <div style="display: flex; align-items: center; gap: 12px;">
                <i class="fas fa-info-circle" style="color: var(--color-primary-soft); font-size: 14px;"></i>
                <div>
                    <div style="font-size: 12px; color: var(--color-body); margin: 0; line-height: 1.4;">
                        这是一个智能面试 Agent，可以帮助你进行模拟面试、简历分析和职业发展咨询。
                    </div>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="helpModal">
            <div class="modal">
                <div class="modal-header">
                    <h2>可用命令</h2>
                    <button class="modal-close" id="closeModal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="command-item">
                        <code>/start</code>
                        <p>开始面试流程</p>
                    </div>
                    <div class="command-item">
                        <code>/end</code>
                        <p>结束面试</p>
                    </div>
                    <div class="command-item">
                        <code>/resume</code>
                        <p>查看简历内容</p>
                    </div>
                    <div class="command-item">
                        <code>/vector 关键词</code>
                        <p>查看向量库中相关JD数量</p>
                    </div>
                    <div class="command-item">
                        <code>/history</code>
                        <p>查看对话历史</p>
                    </div>
                    <div class="command-item">
                        <code>/clear</code>
                        <p>清空对话历史</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message agent">
                    <div class="message-header"><i class="fas fa-robot"></i> Agent</div>
                    <div class="message-content">开始与面试 Agent 对话吧！<br><span style="font-size: 12px; color: #6b7280;">输入 /start 开始面试</span></div>
                </div>
            </div>

            <div class="chat-input">
                <textarea id="messageInput" placeholder="输入消息... (Shift+Enter 换行, Enter 发送)"></textarea>
                <button id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                    <span>发送</span>
                </button>
            </div>

            <div class="status-bar">
                <div class="status-dot"></div>
                <span id="statusText">Agent 就绪</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var sessionId = "";
            var isTyping = false;

            var messageInput = document.getElementById("messageInput");
            var sendBtn = document.getElementById("sendBtn");
            var chatMessages = document.getElementById("chatMessages");
            var statusText = document.getElementById("statusText");
            var helpBtn = document.getElementById("helpBtn");
            var helpModal = document.getElementById("helpModal");
            var closeModal = document.getElementById("closeModal");

            // UUID v4 正则，用于检测后端是否已替换占位符
            // 只有当注入值看起来像真实 UUID 时才使用，否则降级
            var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

            function getSessionId() {
                var input = document.getElementById("sessionIdInput");
                var injectedId = input ? input.value : "";
                // 用正则检测是否被后端替换成了真 UUID
                if (injectedId && UUID_RE.test(injectedId)) {
                    localStorage.setItem("agentSessionId", injectedId);
                    return injectedId;
                }

                var urlParams = new URLSearchParams(window.location.search);
                var urlSession = urlParams.get("session_id");
                if (urlSession && urlSession.length > 0) {
                    localStorage.setItem("agentSessionId", urlSession);
                    return urlSession;
                }

                var lsSession = localStorage.getItem("agentSessionId");
                if (lsSession && lsSession.length > 0) {
                    return lsSession;
                }

                var newId = "sess_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9);
                localStorage.setItem("agentSessionId", newId);
                return newId;
            }

            sessionId = getSessionId();

            function checkSession() {
                fetch("/api/sessions/" + sessionId + "/status")
                    .then(function(resp) {
                        if (resp.ok) return resp.json();
                        throw new Error("Status " + resp.status);
                    })
                    .then(function(data) {
                        if (data.status === "terminated") {
                            statusText.textContent = "面试已结束，请输入 /start 开始新的面试";
                        } else {
                            statusText.textContent = "Agent 就绪";
                        }
                    })
                    .catch(function(err) {
                        console.error("会话检查失败:", err);
                    });
            }

            function sendMessage() {
                var message = messageInput.value.trim();
                if (!message || isTyping) return;

                isTyping = true;
                statusText.textContent = "Agent 正在思考...";
                showTypingIndicator();

                addMessage("user", message);
                messageInput.value = "";
                messageInput.style.height = "auto";

                fetch("/api/sessions/" + sessionId + "/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: message })
                })
                .then(function(resp) { return resp.json(); })
                .then(function(result) {
                    removeTypingIndicator();
                    addMessage("agent", result.message);
                    statusText.textContent = "Agent 就绪";
                    isTyping = false;
                })
                .catch(function(err) {
                    console.error("发送失败:", err);
                    removeTypingIndicator();
                    addMessage("agent", "[错误] 服务器响应失败，请检查网络连接");
                    statusText.textContent = "Agent 就绪";
                    isTyping = false;
                });
            }

            function addMessage(role, content) {
                var messageDiv = document.createElement("div");
                messageDiv.className = "message " + role;

                var header = role === "user" ? "你" : "Agent";
                var icon = role === "user" ? "fas fa-user" : "fas fa-robot";
                var escapedContent = escapeHtml(content);

                messageDiv.innerHTML = '<div class="message-header"><i class="' + icon + '"></i>' + header + '</div>'
                    + '<div class="message-content">' + escapedContent + '</div>';

                if (chatMessages.children.length === 1 && chatMessages.querySelector(".message.agent").textContent.indexOf("开始与面试") >= 0) {
                    chatMessages.innerHTML = "";
                }

                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function showTypingIndicator() {
                var indicator = document.createElement("div");
                indicator.className = "message agent";
                indicator.id = "typingIndicator";
                indicator.innerHTML = '<div class="typing">'
                    + '<i class="fas fa-robot"></i>'
                    + '<div class="typing-dot"></div>'
                    + '<div class="typing-dot"></div>'
                    + '<div class="typing-dot"></div>'
                    + '<span>Agent 正在思考...</span></div>';
                chatMessages.appendChild(indicator);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function removeTypingIndicator() {
                var indicator = document.getElementById("typingIndicator");
                if (indicator) indicator.remove();
            }

            function escapeHtml(text) {
                return text
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&#34;")
                    .replace(/'/g, "&#39;");
            }

            messageInput.addEventListener("keydown", function(e) {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            messageInput.addEventListener("input", function() {
                this.style.height = "auto";
                this.style.height = Math.min(this.scrollHeight, 100) + "px";
            });
            sendBtn.addEventListener("click", sendMessage);

            helpBtn.addEventListener("click", function() {
                helpModal.classList.add("active");
            });
            closeModal.addEventListener("click", function() {
                helpModal.classList.remove("active");
            });
            helpModal.addEventListener("click", function(e) {
                if (e.target === helpModal) {
                    helpModal.classList.remove("active");
                }
            });

            checkSession();
        })();
    </script>
</body>
</html>
